[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netping"
version = "0.0.1"
description = "Server-resident LAN ping dashboard (up to /24, air-gapped)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Francesco (Owner) and Contributors" }]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------- pytest ----------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

# ---------------- ruff ------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
  "PLR2004", # magic-value comparison — fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

# ---------------- black -----------------

[tool.black]
line-length = 100
target-version = ["py311"]
