contract_version: "1.0"

# === IDENTITAET ===
repo:
  name: "client--francesco-ping-app"
  description: "Server-resident LAN ping dashboard (up to /24, air-gapped). Fremd-Repo von Kollege Francesco."
  suite: "client"
  status: "wip"

# === CLIENT-BLOCK (Sub-Konvention client--*) ===
client:
  customer_name: "Francesco"
  contract_status: "discovery"
  data_sensitivity: "low"

# === REPO-TYP ===
type:
  primary: "webapp"
  tags: [client, external-ssot, air-gapped, server-app]

# === TECH-STACK ===
stack:
  languages: [python, javascript]
  runtime: "python"
  runtime_version: ">=3.11"
  framework: "fastapi"
  package_manager: "pip + pip-tools"
  database: "sqlite"
  test_framework: "pytest"

# === VERZEICHNIS-LAYOUT ===
paths:
  source: "src/"
  tests: "tests/"
  docs: "00_infos/"
  context: "00_infos/llm-context.md"
  holds: "00_infos/meta/open-questions.md"
  archive: "99_archiv/"
  entrypoint: "src/netping/app.py"   # geplant fuer Sprint 2

# === COMMANDS ===
commands:
  dev: "make install-dev && .venv/bin/uvicorn netping.app:app --reload --app-dir src"
  build: "tools/build_bundle.sh"
  test: "make test"
  lint: "make lint"
  format: "make format"
  smoke: ".venv/bin/pytest tests/test_parser.py"

# === DEPLOYMENT ===
deployment:
  deployed: false   # Kein Deploy bei uns (Francesco SSOT)
  mode: "not-deployed"
  ci:
    platform: "none"
    auto_deploy: false

# === ENV ===
env:
  required: []
  optional:
    - PING_PORT
    - PING_BIND_HOST
    - PING_DB_PATH
    - PING_MAX_CONCURRENT_PINGS
    - PING_SAMPLE_RETENTION_DAYS
    - PING_EVENT_RETENTION_DAYS
    - PING_SLOW_THRESHOLD_MS
    - PING_LANGUAGE_DEFAULT

# === ABHAENGIGKEITEN ===
depends_on:
  services: []
  repos: []
